# Runs the offline test-suite and the frontend build on every push / pull request, and scans for leaked secrets.
# Tests that need ffmpeg or Chromium skip themselves when those are missing on the runner.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Backend tests
        working-directory: backend
        run: |
          uv sync
          uv run pytest -q
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
