<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="g" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#6D7CFF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6D7CFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6D7CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="420" fill="url(#halo)"/>
  <!-- Cube silhouette (isometric hexagon). The three visible edges meeting inside it are
       replaced by an "M": LL -> UL -> centre -> UR -> LR. -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M512 182 L798 347 L798 677 L512 842 L226 677 L226 347 Z"
          stroke="url(#g)" stroke-width="30" stroke-opacity="0.55"/>
    <path d="M226 677 L226 347 L512 512 L798 347 L798 677"
          stroke="url(#g)" stroke-width="70" filter="url(#glow)" opacity="0.55"/>
    <path d="M226 677 L226 347 L512 512 L798 347 L798 677"
          stroke="url(#g)" stroke-width="64"/>
  </g>
  <circle cx="512" cy="512" r="20" fill="#F8FAFC"/>
</svg>
