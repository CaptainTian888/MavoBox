[project]
name = "tiktol-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "keyring>=25,<26",
    "yt-dlp>=2025.1",
    "playwright==1.56.0",
    "httpx>=0.27,<1",
    "scenedetect>=0.6.4,<1",
    "opencv-python-headless>=4.10,<5",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "pyinstaller>=6.22.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
